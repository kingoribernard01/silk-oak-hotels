<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Silk Oak Hotels - Experience luxury accommodation, fine dining, and entertainment in Nairobi. Locations in Kasarani, Utawala, and CBD." />
    <meta name="theme-color" content="#1A1A1A" />
    <title>Silk Oak Hotels | Comfort, Style & Hospitality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                50: '#FBF7E6',
                100: '#F5ECBF',
                200: '#EBDC95',
                300: '#DEC564',
                400: '#D4AF37', // Classic Gold
                500: '#B59228',
                600: '#94741C',
                700: '#735815',
                800: '#564213',
                900: '#3D2F10',
              },
              charcoal: {
                800: '#2C2C2C',
                900: '#1A1A1A',
                950: '#0D0D0D',
              },
              beige: {
                50: '#F9F8F6',
                100: '#F2EFE9',
                200: '#E6E0D4',
              }
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Montserrat"', 'sans-serif'],
            },
            animation: {
              'fade-in-up': 'fadeInUp 1s ease-out forwards',
              'slow-zoom': 'subtleZoom 20s infinite alternate',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              subtleZoom: {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }
      .pattern-dots {
        background-image: radial-gradient(#D4AF37 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>

}
</script>
